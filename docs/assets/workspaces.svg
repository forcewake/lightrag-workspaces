<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="444" viewBox="0 0 1200 444" role="img" aria-labelledby="title desc">
<title id="title">Separate corpora behind one LightRAG interface and API</title>
<desc id="desc">Illustrative diagram. A browser selecting research and an API request to research use one workspace gateway. The gateway routes to a research worker and a separate handbook worker. Each worker owns its own saved corpus and input directory.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#49745f" stroke-width="1.5"/></marker></defs>
<rect x="1" y="1" width="1198" height="442" rx="16" fill="#f5f8f0" stroke="#dce5de"/>
<g font-family="Inter, system-ui, -apple-system, sans-serif" fill="#172923">
<rect x="40" y="74" width="278" height="118" rx="10" fill="#fff" stroke="#c7d6ca"/><text x="64" y="111" font-size="21" font-weight="600">Browser interface</text><rect x="64" y="131" width="230" height="37" rx="5" fill="#eaf2e8"/><text x="78" y="156" font-size="17">Workspace: research</text><path d="m270 146 5 5 5-5" fill="none" stroke="#49745f" stroke-width="2"/>
<rect x="40" y="226" width="278" height="118" rx="10" fill="#fff" stroke="#c7d6ca"/><text x="64" y="263" font-size="21" font-weight="600">API request</text><text x="64" y="299" font-family="ui-monospace, monospace" font-size="15">/workspaces/research/query</text>
<rect x="444" y="142" width="278" height="134" rx="12" fill="#194c3c"/><text x="468" y="187" font-size="23" font-weight="600" fill="#fff">Workspace gateway</text><text x="468" y="222" font-size="18" fill="#d8f3e4">Explicit selection</text><text x="468" y="249" font-size="16" fill="#d8f3e4">Bounded worker pool</text>
<rect x="848" y="54" width="312" height="146" rx="10" fill="#d8f3e4" stroke="#a9cdb6"/><text x="872" y="93" font-size="22" font-weight="600">research</text><text x="872" y="124" font-size="17">Its own worker process</text><path d="M872 149h14l4 5h20v23h-38z" fill="none" stroke="#49745f" stroke-width="1.5"/><text x="924" y="169" font-size="16">Corpus + input files</text>
<rect x="848" y="238" width="312" height="146" rx="10" fill="#fff" stroke="#c7d6ca"/><text x="872" y="277" font-size="22" font-weight="600">handbook</text><text x="872" y="308" font-size="17">Another independent worker</text><path d="M872 333h14l4 5h20v23h-38z" fill="none" stroke="#49745f" stroke-width="1.5"/><text x="924" y="353" font-size="16">Corpus + input files</text>
<text x="40" y="410" font-size="15" fill="#4e635a">Illustrative routing · Workers load on demand · Models and access configuration are shared</text></g>
