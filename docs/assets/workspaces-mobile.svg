<svg xmlns="http://www.w3.org/2000/svg" width="520" height="660" viewBox="0 0 520 660" role="img" aria-labelledby="title desc">
<title id="title">One gateway, separate corpus workers</title><desc id="desc">Illustrative vertical diagram. A browser or API selects research. One gateway routes the request to its own worker. Research and handbook each have their own corpus and inputs. Provider and access settings remain shared.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#49745f" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="518" height="658" rx="16" fill="#f5f8f0" stroke="#dce5de"/>
<g font-family="Inter, system-ui, -apple-system, sans-serif" fill="#172923"><rect x="36" y="34" width="448" height="136" rx="10" fill="#fff" stroke="#c7d6ca"/><text x="60" y="73" font-size="24" font-weight="600">Browser or API</text><text x="60" y="111" font-size="20">Workspace: research</text><text x="60" y="145" font-family="ui-monospace, monospace" font-size="16">/workspaces/research/query</text>
<rect x="70" y="238" width="380" height="128" rx="12" fill="#194c3c"/><text x="94" y="283" font-size="25" font-weight="600" fill="#fff">Workspace gateway</text><text x="94" y="319" font-size="20" fill="#d8f3e4">Explicit selection</text><text x="94" y="346" font-size="17" fill="#d8f3e4">Workers load on demand</text>
<rect x="28" y="447" width="222" height="144" rx="10" fill="#d8f3e4" stroke="#a9cdb6"/><text x="48" y="486" font-size="23" font-weight="600">research</text><text x="48" y="521" font-size="18">Its own process</text><text x="48" y="558" font-size="17">Corpus + inputs</text>
<rect x="270" y="447" width="222" height="144" rx="10" fill="#fff" stroke="#c7d6ca"/><text x="290" y="486" font-size="23" font-weight="600">handbook</text><text x="290" y="521" font-size="18">Its own process</text><text x="290" y="558" font-size="17">Corpus + inputs</text><text x="260" y="625" text-anchor="middle" font-size="16" fill="#4e635a">Illustration · Models and access settings are shared</text></g>
<g fill="none" stroke="#49745f" stroke-width="2" marker-end="url(#arrow)"><path d="M260 170v68"/><path d="M220 366v40h-81v41"/><path d="M300 366v40h81v41"/></g></svg>