name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: For vulnerabilities, use the private reporting instructions in SECURITY.md. Keep credentials, private corpus names, and documents out of issues.
  - type: input
    id: version
    attributes:
      label: Extension revision and platform
      placeholder: v0.1.0, Docker on Linux amd64
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal synthetic example, expected behavior, and what happened.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Relevant errors and configuration variable names only. Remove real addresses, tokens, document text, and workspace identifiers.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials and private data from this report.
          required: true
