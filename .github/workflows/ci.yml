name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.9.29'
      - name: Install locked dependencies
        run: uv sync --frozen --python '${{ matrix.python }}'
      - name: Test gateway and worker behavior
        run: |
          uv run --frozen python -m unittest discover -s tests -v
          uv run --frozen python -m unittest test_worker -v

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked documentation dependencies
        run: python -m pip install --require-hashes -r requirements-docs.txt
      - name: Build documentation and check internal links
        run: mkdocs build --strict

  container:
    name: Source build and offline integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the pinned runtime and frontend from source
        run: docker build -t lightrag-workspaces:ci .
      - name: Verify real workers with disposable data and no network
        run: python3 scripts/smoke_container.py --engine docker --image lightrag-workspaces:ci
      - name: Start an isolated PostgreSQL and VectorChord fixture
        run: |
          docker network create lightrag-postgres-ci
          docker run -d --name lightrag-postgres-ci --network lightrag-postgres-ci \
            -e POSTGRES_PASSWORD=synthetic-ci-only -e POSTGRES_DB=lightrag_ci \
            tensorchord/vchord-postgres:pg18-v1.1.1@sha256:2cfaf4ea4cf744dd53c750b82901fb1bc118a4e3b96ab5b499ce690b4f124cd8
          for attempt in $(seq 1 30); do
            if docker exec lightrag-postgres-ci pg_isready -U postgres -d lightrag_ci; then break; fi
            sleep 1
          done
          docker exec lightrag-postgres-ci psql -v ON_ERROR_STOP=1 -U postgres -d lightrag_ci \
            -c 'CREATE EXTENSION vector; CREATE EXTENSION vchord;'
      - name: Verify migration, native PostgreSQL stores, and workspace routing
        run: |
          docker run --rm --network lightrag-postgres-ci --memory=6g --cpus=2 \
            -e POSTGRES_HOST=lightrag-postgres-ci -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=synthetic-ci-only -e POSTGRES_DATABASE=lightrag_ci \
            --mount "type=bind,src=$PWD/scripts/smoke_postgres.py,dst=/checks/smoke_postgres.py,readonly" \
            --entrypoint python lightrag-workspaces:ci /checks/smoke_postgres.py --target-database lightrag_ci
      - name: Remove the owned PostgreSQL fixture
        if: always()
        run: |
          docker rm -f lightrag-postgres-ci || true
          docker network rm lightrag-postgres-ci || true
